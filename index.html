<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub - Premium Viewer</title>
    <style>
        /* Modern Dark Theme CSS */
        :root {
            --primary-color: #e50914;
            --bg-color: #0f0f0f;
            --header-bg: #141414;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        header {
            background-color: var(--header-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 span {
            color: var(--primary-color);
        }

        /* Friendly Navigation Buttons */
        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-buttons button {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid transparent;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-buttons button:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .nav-buttons button.primary {
            background-color: var(--primary-color);
        }

        .nav-buttons button.primary:hover {
            background-color: #f6121d;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        /* Main Viewing Area */
        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            background-color: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Stream<span>Hub</span></h1>
        <div class="nav-buttons">
            <button onclick="reloadStream()">🔄 Refresh Stream</button>
            <button onclick="goHome()">🏠 Home</button>
            <button class="primary" onclick="toggleFullscreen()">🔲 Fullscreen Mode</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 
            Sandbox attribute removed to allow the third-party player to load its security scripts.
            Pop-up blocking must now be handled by iPad Safari Settings or an AdBlocker extension.
        -->
        <iframe 
            id="videoPlayer" 
            src="https://socialtoolsbyhashim.site/empireflix.php/"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const iframe = document.getElementById('videoPlayer');

        // Function to refresh the iframe if a stream gets stuck
        function reloadStream() {
            const currentSrc = iframe.src;
            iframe.src = '';
            setTimeout(() => {
                iframe.src = currentSrc;
            }, 100);
        }

        // Function to return to the root directory
        function goHome() {
            iframe.src = "https://socialtoolsbyhashim.site/empireflix.php/";
        }

        // Function to push the iframe into full screen
        function toggleFullscreen() {
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.mozRequestFullScreen) { /* Firefox */
                iframe.mozRequestFullScreen();
            } else if (iframe.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) { /* IE/Edge */
                iframe.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
